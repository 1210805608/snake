<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A lightweight browser-based Snake game built with vanilla HTML, CSS, and JavaScript.">
  <title>Snake Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-container">
    <header><h1>🐍 贪吃蛇</h1><p class="subtitle">Snake Game</p></header>
    <section class="score-board" aria-label="Game score">
      <div class="score-card"><span>分数</span><strong id="score">0</strong></div>
      <div class="score-card"><span>最高分</span><strong id="highScore">0</strong></div>
    </section>
    <section class="game-area" aria-label="Snake game">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="overlay" id="pauseOverlay" hidden>暂停</div>
    </section>
    <p class="status" id="gameStatus" role="status" aria-live="polite"></p>
    <section class="controls" aria-label="Game controls">
      <p>移动：<kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></p>
      <p>暂停：<kbd>Space</kbd></p>
    </section>
    <div class="actions"><button type="button" id="startBtn">开始游戏</button><button type="button" id="pauseBtn" disabled>暂停</button></div>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
